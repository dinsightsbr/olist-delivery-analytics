name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC: warehouse checks
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-lint:
    name: SQL lint (SQLFluff, Snowflake dialect)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint sql/
        run: sqlfluff lint sql --format github-annotation-native

  pbip-validate:
    name: PBIP schema validation + generator drift
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate every report JSON against the Microsoft PBIR schemas
        run: python powerbi/validate_pbip.py
      - name: Regenerate the project and compare with the committed definition
        # The generator is the source of truth. Edits saved from Power BI Desktop must be ported
        # back into build_pbip.py; until then this step warns instead of failing the build.
        continue-on-error: true
        run: |
          python powerbi/build_pbip.py
          if ! git diff --quiet -- powerbi/; then
            echo "::warning title=Generator drift::Committed PBIP differs from build_pbip.py output. Re-run the generator or port Desktop edits into it."
            git diff --stat -- powerbi/
            exit 1
          fi

  model-diff:
    name: Semantic model diff on the PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Diff measures and relationships against the base branch
        run: python tools/measure_diff.py "origin/${{ github.base_ref }}" HEAD > model-diff.md
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: model-diff
          path: model-diff.md

  ai-sql-review:
    name: AI review of SQL changes (Claude)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Any SQL changed, and is the reviewer enabled?
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- "sql/*.sql"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Claude reviews the SQL diff
        if: steps.gate.outputs.changed == 'true' && steps.gate.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }} of this repository.
            Review ONLY the changes to files under sql/ (run `git diff origin/${{ github.base_ref }}...HEAD -- 'sql/*.sql'`)
            and follow the rules and output format in .github/prompts/sql-review.md.
            Write the review in your comment. Do not approve, request changes, edit files or push.
          # Quote the tool list: the action splits claude_args on spaces.
          claude_args: >-
            --max-turns 6
            --allowedTools "Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"
          show_full_output: true
      - name: Explain why the review did not run
        if: steps.gate.outputs.changed == 'true' && steps.gate.outputs.enabled != 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ai-sql-review
          message: |
            ### 🤖 AI review of the SQL changes
            Not enabled: add the `CLAUDE_CODE_OAUTH_TOKEN` secret (from `claude setup-token`, Claude Pro/Max)
            or `ANTHROPIC_API_KEY` to let Claude review `sql/` changes on pull requests. The prompt and the
            rules it follows are in `.github/prompts/sql-review.md`.

  snowflake-checks:
    name: Warehouse checks (Snowflake)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    # Set the repository variable SNOWFLAKE_RUNNER to "self-hosted" to run this job on the VPS runner.
    runs-on: ${{ vars.SNOWFLAKE_RUNNER || 'ubuntu-latest' }}
    environment: snowflake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-snowflake.txt
      - name: Run data-quality and reconciliation checks against OLIST.MARTS
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE || 'COMPUTE_WH' }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE || 'BI_READER' }}
        run: python tools/run_checks.py
