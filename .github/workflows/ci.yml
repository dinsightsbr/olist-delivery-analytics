name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC: warehouse checks
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-lint:
    name: SQL lint (SQLFluff, Snowflake dialect)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint sql/
        run: sqlfluff lint sql --format github-annotation-native

  pbip-validate:
    name: PBIP schema validation + generator drift
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate every report JSON against the Microsoft PBIR schemas
        run: python powerbi/validate_pbip.py
      - name: Regenerate the project and compare with the committed definition
        # The generator is the source of truth. Edits saved from Power BI Desktop must be ported
        # back into build_pbip.py; until then this step warns instead of failing the build.
        continue-on-error: true
        run: |
          python powerbi/build_pbip.py
          if ! git diff --quiet -- powerbi/; then
            echo "::warning title=Generator drift::Committed PBIP differs from build_pbip.py output. Re-run the generator or port Desktop edits into it."
            git diff --stat -- powerbi/
            exit 1
          fi

  model-diff:
    name: Semantic model diff on the PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Diff measures and relationships against the base branch
        run: python tools/measure_diff.py "origin/${{ github.base_ref }}" HEAD > model-diff.md
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: model-diff
          path: model-diff.md

  ai-sql-review:
    name: AI review of SQL changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Any SQL changed, and is the reviewer enabled?
        id: gate
        env:
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          git diff --unified=4 "origin/${{ github.base_ref }}...HEAD" -- "sql/*.sql" > sql.diff
          if [ -s sql.diff ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "enabled=$HAS_KEY" >> "$GITHUB_OUTPUT"
      - name: Ask the model for a review
        if: steps.gate.outputs.changed == 'true' && steps.gate.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: ${{ vars.AI_REVIEW_MODEL || 'gpt-4.1-mini' }}
        run: |
          jq -n --arg model "$MODEL" --rawfile sys .github/prompts/sql-review.md --rawfile diff sql.diff \
            '{model: $model, temperature: 0.2, max_tokens: 1500,
              messages: [{role: "system", content: $sys},
                         {role: "user", content: ("Unified diff of sql/*.sql:\n\n" + $diff)}]}' > request.json
          curl -sS --fail-with-body https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" \
            -d @request.json > response.json
          {
            echo "### AI review of the SQL changes"
            echo
            jq -r '.choices[0].message.content' response.json
            echo
            echo "<sub>Model: $MODEL · prompt: .github/prompts/sql-review.md · advisory only, the reviewer decides.</sub>"
          } > review.md
          echo "model usage (tokens): $(jq -r '.usage.total_tokens // "n/a"' response.json)"
      - name: Post the review
        if: steps.gate.outputs.changed == 'true' && steps.gate.outputs.enabled == 'true' && hashFiles('review.md') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ai-sql-review
          path: review.md
      - name: Explain why the review did not run
        if: steps.gate.outputs.changed == 'true' && steps.gate.outputs.enabled != 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ai-sql-review
          message: |
            ### AI review of the SQL changes
            Not enabled: add the `OPENAI_API_KEY` secret to have a model review `sql/` changes on pull requests.
            The prompt and the rules it follows are in `.github/prompts/sql-review.md`.

  snowflake-checks:
    name: Warehouse checks (Snowflake)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    # Set the repository variable SNOWFLAKE_RUNNER to "self-hosted" to run this job on the VPS runner.
    runs-on: ${{ vars.SNOWFLAKE_RUNNER || 'ubuntu-latest' }}
    environment: snowflake
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-snowflake.txt
      - name: Run data-quality and reconciliation checks against OLIST.MARTS
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE || 'COMPUTE_WH' }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE || 'BI_READER' }}
        run: python tools/run_checks.py
