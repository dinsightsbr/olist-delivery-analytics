name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Monday 09:00 UTC: warehouse checks
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-lint:
    name: SQL lint (SQLFluff, Snowflake dialect)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint sql/
        run: sqlfluff lint sql --format github-annotation-native

  pbip-validate:
    name: PBIP schema validation + generator drift
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate every report JSON against the Microsoft PBIR schemas
        run: python powerbi/validate_pbip.py
      - name: Regenerate the project and compare with the committed definition
        # The generator is the source of truth. Edits saved from Power BI Desktop must be ported
        # back into build_pbip.py; until then this step warns instead of failing the build.
        continue-on-error: true
        run: |
          python powerbi/build_pbip.py
          if ! git diff --quiet -- powerbi/; then
            echo "::warning title=Generator drift::Committed PBIP differs from build_pbip.py output. Re-run the generator or port Desktop edits into it."
            git diff --stat -- powerbi/
            exit 1
          fi

  model-diff:
    name: Semantic model diff on the PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diff measures and relationships against the base branch
        run: python tools/measure_diff.py "origin/${{ github.base_ref }}" HEAD > model-diff.md
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: model-diff
          path: model-diff.md

  ai-sql-review:
    name: AI review of SQL changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      models: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect the SQL diff
        id: diff
        run: |
          git diff --unified=4 "origin/${{ github.base_ref }}...HEAD" -- "sql/*.sql" > sql.diff
          if [ -s sql.diff ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ask the model for a review (GitHub Models, no extra secret needed)
        if: steps.diff.outputs.changed == 'true'
        id: ai
        uses: actions/ai-inference@v3
        with:
          model: openai/gpt-4.1
          system-prompt-file: .github/prompts/sql-review.md
          prompt-file: sql.diff
          max-tokens: 1500
      - name: Post the review as a sticky comment
        if: steps.diff.outputs.changed == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ai-sql-review
          message: |
            ### 🤖 AI review of the SQL changes
            ${{ steps.ai.outputs.response }}

            <sub>Generated by actions/ai-inference from the diff of sql/*.sql. Advisory only; the human reviewer decides.</sub>

  snowflake-checks:
    name: Warehouse checks (Snowflake)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    # Set the repository variable SNOWFLAKE_RUNNER to "self-hosted" to run this job on the VPS runner.
    runs-on: ${{ vars.SNOWFLAKE_RUNNER || 'ubuntu-latest' }}
    environment: snowflake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-snowflake.txt
      - name: Run data-quality and reconciliation checks against OLIST.MARTS
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE || 'COMPUTE_WH' }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE || 'BI_READER' }}
        run: python tools/run_checks.py
